name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '8.1.0'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ═══════════════════════════════════════════════════════════
  # LINT - Verificación de código (informativo, no bloquea build)
  # ═══════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: 🔐 Setup local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ hashFiles('android/**/*.gradle*') }}
            gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔍 Run Android Lint (continue on error)
        run: cd android && ./gradlew lint --no-daemon || true

      - name: 📊 Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/outputs/lint-results-*.xml
          retention-days: 14

      - name: 📋 Upload Lint Summary
        if: always()
        run: |
          if [ -f android/app/build/reports/lint-results-debug.html ]; then
            echo "## Lint Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "✅ Lint completed. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════
  # BUILD DEBUG - Compilación de APK debug
  # ═══════════════════════════════════════════════════════════
  build-debug:
    name: 🛠️ Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_name: ${{ steps.build.outputs.apk_name }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: 🔐 Setup local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ hashFiles('android/**/*.gradle*') }}
            gradle-

      - name: 📦 Cache Android build
        uses: actions/cache@v4
        with:
          path: |
            android/app/build
            android/.gradle
          key: build-${{ hashFiles('android/**/*.java', 'android/**/*.xml', 'android/**/*.kt') }}
          restore-keys: |
            build-

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug APK
        id: build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          # Find APK
          echo "Searching for APK..."
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          
          # Verify
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully: $(basename $APK_PATH)"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found, listing debug output dir:"
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
            find . -name "*.apk" 2>/dev/null || echo "No APKs found"
            exit 1
          fi

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          compression-level: 9

      - name: 📋 Add Build Summary
        run: |
          echo "### 🛠️ Build Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ steps.build.outputs.apk_name || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # BUILD RELEASE - Compilación de APK release
  # ═══════════════════════════════════════════════════════════
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
    permissions:
      contents: write
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: 🔐 Setup local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: 🔐 Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "✅ Keystore configured"

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Release APK
        id: build
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/apk/release/*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 🚀 Build Debug (fallback sin keystore)
        id: build-fallback
        if: env.KEYSTORE_BASE64 == ''
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          APK_PATH=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 9

      - name: 🎉 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # NOTIFICATION - Notificar resultados
  # ═══════════════════════════════════════════════════════════
  notify:
    name: 📢 Notify Status
    runs-on: ubuntu-latest
    needs: [build-debug]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: 📋 Create Status Summary
        run: |
          echo "### 📱 OpenHands Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug | ${{ needs.build-debug.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Release | ${{ needs.build-release.result == 'success' && '✅ Success' || (needs.build-release.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📱 Build Status\n\n' +
                '| Build | Status |\n' +
                '|-------|--------|\n' +
                '| Debug APK | ' + ('${{ needs.build-debug.result }}' === 'success' ? '✅ Success' : '❌ Failed') + ' |\n\n' +
                '**Artifacts:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="AI Software Agent - Build, test, and deploy code with AI agents">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenHands">
  
  <title>OpenHands</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="https://app.all-hands.dev/favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    h1 {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 600;
    }
    
    p {
      margin-top: 10px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>OpenHands</h1>
    <p>Loading...</p>
  </div>
  
  <iframe 
    id="app"
    src="https://app.all-hands.dev/"
    style="width: 100%; height: 100%; border: none;"
    allow="camera; microphone; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
  ></iframe>
  
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then((registration) => {
          console.log('ServiceWorker registered:', registration.scope);
        })
        .catch((error) => {
          console.log('ServiceWorker registration failed:', error);
        });
    }
    
    // Hide loading when iframe loads
    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');
    
    iframe.addEventListener('load', () => {
      loading.classList.add('hidden');
      setTimeout(() => {
        loading.style.display = 'none';
      }, 300);
    });
    
    // Handle errors
    iframe.addEventListener('error', () => {
      document.querySelector('#loading p').textContent = 'Failed to load. Check your connection.';
    });
  </script>
</body>
</html>
